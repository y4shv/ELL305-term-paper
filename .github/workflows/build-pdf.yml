name: Build and Publish PDF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: main.pdf
          path: main.pdf

      - name: Publish PDF to 'pdf' branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p /tmp/pdf_out
          cp main.pdf /tmp/pdf_out/main.pdf
          
          git fetch origin pdf:pdf || true
          if git rev-parse --verify pdf >/dev/null 2>&1; then
            git checkout pdf
          else
            git checkout --orphan pdf
            git rm -rf .
          fi
          
          cp /tmp/pdf_out/main.pdf ./main.pdf
          git add main.pdf
          git commit -m "Auto-generate main.pdf from latest main commit [skip ci]" || echo "No changes to commit"
          git push origin pdf
